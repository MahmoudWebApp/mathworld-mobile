name: Flutter analyze and geometry tests

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [feature/premium-entitlements-client]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare non-secret CI environment asset
        run: |
          if [ ! -f .env ]; then
            printf 'API_BASE_URL=https://example.invalid/api\\n' > .env
          fi
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run geometry, brand, math typography, RTL and Premium tests
        run: flutter test test/widgets/mathworld_pagination_test.dart test/widgets/rich_math_text_test.dart test/rtl_navigation_test.dart test/geometry_diagram_test.dart test/premium_gift_model_test.dart test/premium_account_snapshot_test.dart test/brand_logo_widget_test.dart test/glass_card_interaction_test.dart test/category_grid_layout_test.dart test/notification_pagination_test.dart test/premium_analytics_parse_test.dart test/premium_analytics_pdf_test.dart test/google_oauth_configuration_test.dart test/leaderboard_data_test.dart test/models/solution_structure_test.dart
