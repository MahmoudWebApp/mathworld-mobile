name: Flutter analyze and geometry tests

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [feature/premium-entitlements-client]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare non-secret CI environment asset
        run: |
          if [ ! -f .env ]; then
            printf 'API_BASE_URL=https://example.invalid/api\\n' > .env
          fi
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run geometry and Premium gift parsing tests
        run: flutter test test/geometry_diagram_test.dart test/premium_gift_model_test.dart test/premium_account_snapshot_test.dart
