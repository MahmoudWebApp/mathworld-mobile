name: Normalize approved MathWorld logo assets on the feature branch

# One-off asset generation for the requested black-square launcher cleanup.
# Pushes only generated artwork to this dedicated feature branch, never main.
on:
  push:
    branches:
      - feature/stage-daily-quota-mobile-brand-fixes-v1
    paths:
      - '.github/scripts/normalize_android_brand.py'
      - '.github/workflows/normalize-brand-art.yml'

permissions:
  contents: write

jobs:
  normalize:
    if: github.ref == 'refs/heads/feature/stage-daily-quota-mobile-brand-fixes-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/stage-daily-quota-mobile-brand-fixes-v1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install raster editor
        run: python -m pip install 'Pillow==11.3.0'
      - name: Remove only the black outside approved logo and rebuild launcher PNGs
        run: python .github/scripts/normalize_android_brand.py
      - name: Commit generated PNGs to feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/branding/mathworld-mark.png
          git add android/app/src/main/res/drawable-nodpi/mathworld_adaptive_foreground.png
          git add android/app/src/main/res/mipmap-*/ic_launcher.png
          if ! git diff --cached --quiet; then
            git commit -m 'fix(brand): use clean MathWorld artwork in mobile and launcher icons'
            git push origin HEAD:feature/stage-daily-quota-mobile-brand-fixes-v1
          fi
