name: Temporary main reconciliation

on:
  push:
    branches:
      - integration/premium-mobile-reconcile-20261118

permissions:
  contents: write

jobs:
  reconcile:
    if: "!contains(github.event.head_commit.message, '[reconciled-main]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Reconcile latest main in isolated integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MathWorld Integration"
          git config user.email "integration@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff -s ort -X ours origin/main
          # This Actions token cannot modify existing workflow files.
          # Preserve that file for a connector-authorized follow-up.
          git restore --source=HEAD --staged --worktree -- .github/workflows/stage-daily-quota-mobile-ci.yml
          git commit -m "chore: reconcile latest main [reconciled-main]"
          test -f lib/providers/categories_provider.dart
          grep -q 'stageCategories.sort' lib/providers/categories_provider.dart
          test -f lib/screens/premium/premium_progress_report_screen.dart
          git diff --check HEAD^1 HEAD
          git push origin HEAD:refs/heads/integration/premium-mobile-reconcile-20261118
