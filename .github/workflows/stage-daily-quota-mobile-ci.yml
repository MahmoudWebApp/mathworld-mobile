name: Flutter Free-access tests and debug-signed Android QA APK

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'assets/branding/**'
      - 'android/**'
      - 'test/models/stage_daily_quota_test.dart'
      - 'pubspec.yaml'
      - '.github/workflows/stage-daily-quota-mobile-ci.yml'
  push:
    branches:
      - feature/stage-daily-quota-mobile-brand-fixes-v1

permissions:
  contents: read

jobs:
  stage-quota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.10'
          cache: true
      - name: Provide non-secret test environment
        run: cp .env.example .env
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Verify legacy daily quota response stays unlimited
        run: flutter test test/models/stage_daily_quota_test.dart
      - name: Build Android release-mode QA APK (debug-signed)
        run: flutter build apk --release
      - name: Explain artifact signing and release limitation
        run: |
          echo '### Android QA APK — not production signed' >> "$GITHUB_STEP_SUMMARY"
          echo 'This release-mode APK uses the Android debug signing configuration. It is intended for manual UI and launcher-icon validation only, not Google Play publishing.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Production keystore configuration and final application ID are tracked in mobile issue #13.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload debug-signed release-mode QA APK for device validation
        uses: actions/upload-artifact@v4
        with:
          name: mathworld-android-qa-release-mode-debug-signed
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error
