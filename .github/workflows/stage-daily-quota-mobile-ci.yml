name: MathWorld Android (one app, Google sign-in)

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/stage-daily-quota-mobile-ci.yml'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/stage-daily-quota-mobile-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Flutter tests and analyzer (no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.10'
          cache: true
      - name: Provide non-secret application environment
        run: cp .env.example .env
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Verify Free access and Google build configuration
        run: flutter test test/models/stage_daily_quota_test.dart test/daily_challenge_model_test.dart test/google_oauth_configuration_test.dart
      - name: Analyze Flutter
        run: flutter analyze --no-fatal-infos

  google-android-apk:
    name: Build one signed MathWorld Android APK
    needs: verify
    # Keystore secrets are NEVER exposed to pull requests or arbitrary branches.
    # A reviewed main-branch push creates the same signed testing APK automatically.
    # Users may also run this workflow manually on main.
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main' && github.repository == 'MahmoudWebApp/mathworld-mobile'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MATHWORLD_STABLE_DEV_SIGNING: 'true'
      MATHWORLD_QA_KEYSTORE_FILE: 'mathworld-qa.jks'
      MATHWORLD_QA_KEYSTORE_BASE64: ${{ secrets.MATHWORLD_QA_KEYSTORE_BASE64 }}
      MATHWORLD_QA_STORE_PASSWORD: ${{ secrets.MATHWORLD_QA_STORE_PASSWORD }}
      MATHWORLD_QA_KEY_ALIAS: ${{ secrets.MATHWORLD_QA_KEY_ALIAS }}
      MATHWORLD_QA_KEY_PASSWORD: ${{ secrets.MATHWORLD_QA_KEY_PASSWORD }}
      GOOGLE_WEB_CLIENT_ID: ${{ vars.MATHWORLD_GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.10'
          cache: true
      - name: Provide non-secret application environment
        run: cp .env.example .env
      - name: Check signing and OAuth configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MATHWORLD_QA_KEYSTORE_BASE64}" || -z "${MATHWORLD_QA_STORE_PASSWORD}" || -z "${MATHWORLD_QA_KEY_ALIAS}" || -z "${MATHWORLD_QA_KEY_PASSWORD}" ]]; then
            echo "::error::Configure the four MATHWORLD_QA_* GitHub Actions secrets before running the signed Android build."
            exit 1
          fi
          if ! [[ "${GOOGLE_WEB_CLIENT_ID}" =~ ^[0-9]+-[a-zA-Z0-9_-]+[.]apps[.]googleusercontent[.]com$ ]]; then
            echo "::error::Set the MATHWORLD_GOOGLE_WEB_CLIENT_ID Actions variable to the existing MathWorld Web OAuth client ID."
            exit 1
          fi
          printf '%s' "${MATHWORLD_QA_KEYSTORE_BASE64}" | base64 --decode > android/app/mathworld-qa.jks
          test -s android/app/mathworld-qa.jks
          actual_sha1="$(keytool -list -v -keystore android/app/mathworld-qa.jks -alias "${MATHWORLD_QA_KEY_ALIAS}" -storepass:env MATHWORLD_QA_STORE_PASSWORD | awk '/^[[:space:]]*SHA1:/ { print $2; exit }')"
          expected_sha1="8B:E7:F7:DB:00:1B:97:16:8E:E4:7D:3B:56:B6:C0:32:07:51:52:36"
          if [[ "${actual_sha1^^}" != "${expected_sha1}" ]]; then
            echo "::error::The uploaded signing certificate SHA-1 does not match the fingerprint registered in Google Cloud. Do not publish a non-working Google build."
            exit 1
          fi
          echo "One Android app: com.mathworld.mathworld_mobile"
          echo "Stable signing certificate SHA-1 matched."
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Build signed app with Google sign-in enabled
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --no-pub --build-number=${{ github.run_number }} \
            --dart-define=MATHWORLD_SOCIAL_LOGIN_ENABLED=true \
            "--dart-define=MATHWORLD_GOOGLE_SERVER_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID}"
      - name: Upload single MathWorld Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mathworld-android-google-login
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error
      - name: Build summary
        run: |
          echo "### MathWorld Android test build" >> "$GITHUB_STEP_SUMMARY"
          echo "Package: `com.mathworld.mathworld_mobile` (no .qa suffix)." >> "$GITHUB_STEP_SUMMARY"
          echo "Google login enabled with the existing MathWorld Web OAuth client." >> "$GITHUB_STEP_SUMMARY"
          echo "Uses one persistent developer signing key. This APK is for device testing, not Google Play publishing." >> "$GITHUB_STEP_SUMMARY"
