name: Rebuild mobile iOS and PWA launcher icons on dev

on:
  push:
    branches:
      - feature/premium-entitlements-client
    paths:
      - "tools/rebuild_launcher_branding.py"
      - ".github/workflows/rebuild-launcher-branding.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'MahmoudWebApp/mathworld-mobile' && github.ref == 'refs/heads/feature/premium-entitlements-client'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/premium-entitlements-client
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install required image tooling
        run: python -m pip install "Pillow>=11,<13"
      - name: Regenerate native iOS and Flutter Web icons from approved mark
        run: python tools/rebuild_launcher_branding.py
      - name: Review and commit generated images only to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/Runner/Assets.xcassets/AppIcon.appiconset/ ios/Runner/Assets.xcassets/LaunchImage.imageset/ web/favicon.png web/icons/ android/app/src/main/res/drawable-nodpi/ android/app/src/main/res/mipmap-*/
          if git diff --cached --quiet; then
            echo "Existing icons already match approved source"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "fix(brand): replace black iOS and Flutter Web icon backgrounds with approved mark"
          git fetch origin feature/premium-entitlements-client
          git rebase origin/feature/premium-entitlements-client
          git push origin HEAD:feature/premium-entitlements-client
