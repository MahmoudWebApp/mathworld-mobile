name: Rebuild MathWorld launcher icons from the exact original logo

on:
  push:
    branches:
      - main
    paths:
      - "tools/rebuild_launcher_branding.py"
      - ".github/workflows/rebuild-launcher-branding.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'MahmoudWebApp/mathworld-mobile' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install required image tooling
        run: python -m pip install "Pillow>=11,<13"
      - name: Regenerate Android, iOS and PWA icons from exact approved mark
        run: python tools/rebuild_launcher_branding.py
      - name: Commit generated brand assets to the same single app on main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/Runner/Assets.xcassets/AppIcon.appiconset/ ios/Runner/Assets.xcassets/LaunchImage.imageset/ web/favicon.png web/icons/ android/app/src/main/res/drawable-nodpi/ android/app/src/main/res/mipmap-*/
          if git diff --cached --quiet; then
            echo "Existing icons already match approved source"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "fix(brand): replace black iOS and Flutter Web icon backgrounds with approved mark"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
