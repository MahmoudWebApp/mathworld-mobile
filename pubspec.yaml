name: mathworld_mobile
description: "MathWorld educational mobile application for mathematical problems"
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.3.0
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.3.1
  easy_localization: ^3.0.7
  google_fonts: ^8.1.0
  google_sign_in: ^7.2.0
  flutter_dotenv: ^6.0.1
  flutter_math_fork: ^0.7.0
  flutter_svg: ^2.3.0
  intl: ^0.20.2
  url_launcher: ^6.3.1
  share_plus: ^11.1.0
  cross_file: ^0.3.4+2
  # Versions compatible with Flutter 3.32 / Dart <3.12 in CI.
  pdf: '>=3.12.0 <3.13.0'
  printing: '>=5.14.3 <5.15.0'
  # Prevent image 4.11.0 using archive.decodeLazy not available in
  # the transitively selected archive version on our Flutter CI.
  image: 4.10.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/branding/
    - assets/category_icons/
    - .env
