name: mathworld_mobile
description: "MathWorld educational mobile application for mathematical problems"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.3.0
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.3.1
  easy_localization: ^3.0.7
  google_fonts: ^8.1.0
  flutter_dotenv: ^6.0.1
  flutter_math_fork: ^0.7.0
  flutter_svg: ^2.3.0
  intl: ^0.20.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - .env
